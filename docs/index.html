<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CIIM-SAI</title>
  <style>
  #loading {
    position: fixed;
    inset: 0;                      /* fill the viewport */
    background: rgba(250, 250, 248, 0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    z-index: 10;
  }
  #loading[hidden] { display: none; }

  #spinner {
    font-size: 2rem;
    color: #4a7aa7;
  }

  #loading-status { margin: 0; color: #333; }
  #loading-quip {
    margin: 0;
    color: #999;
    font-style: italic;
    min-height: 1.3em;             /* no layout jump between quips */
    transition: opacity 0.3s;
  }
  #output { overflow-x: auto; }
  </style>
</head>
<body>
  <div id="loading" hidden>
    <div id="spinner">|</div>
    <p id="loading-status">Loading…</p>
    <p id="loading-quip"></p>
  </div>
  <h1>CIIM-SAI — proof of concept</h1>
  <pre id="output"></pre>
  <button id="download-csv" disabled>Download results CSV</button>


  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
  <script>
    const QUIPS = [
      "nucleating particles…",
      "balancing Earth's energy budget…",
      "reducing oxidants…",
      "arguing about terminology…",
    ];

    const FRAMES = ["|", "/", "-", "\\"];   // note the escaped backslash
    let spinTimer = null;

    function startSpinner() {
      const el = document.getElementById("spinner");
      let i = 0;
      spinTimer = setInterval(() => {
        el.textContent = FRAMES[i++ % FRAMES.length];
      }, 120);
    }

    let quipTimer = null;

    function startQuips() {
      const el = document.getElementById("loading-quip");
      const order = [...QUIPS].sort(() => Math.random() - 0.5);  // shuffled copy
      let i = 0;
      const next = () => {
        el.style.opacity = 0;
        setTimeout(() => {
          el.textContent = order[i++ % order.length];
          el.style.opacity = 1;
        }, 300);                       // fade out, swap text, fade in
      };
      next();
      quipTimer = setInterval(next, 2600);
    }

    function showLoading(text) {
      document.getElementById("loading-status").textContent = text;
      const overlay = document.getElementById("loading");
      if (overlay.hidden) {
        overlay.hidden = false;
        startQuips();
        startSpinner()
      }
    }

    function hideLoading() {
      document.getElementById("loading").hidden = true;
      clearInterval(quipTimer);
      quipTimer = null;
      clearInterval(spinTimer)
      spinTimer = null
    }

    let pyodide = null;

    async function main() {
      showLoading("Loading Pyodide…")
      try {
        pyodide = await loadPyodide();

        showLoading("Installing model package…");
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("./ciim_sai-0.1.0-py3-none-any.whl");

        showLoading("Running model…");
        const appCode = await (await fetch("./app.py")).text();
        pyodide.runPython(appCode);                          // defines run_model, results_csv
        const summary = pyodide.runPython("run_model()");

        document.getElementById("output").textContent = summary;
        document.getElementById("download-csv").disabled = false;
        hideLoading();
      } catch (err) {
        hideLoading();
        document.getElementById("output").textContent = "FAILED:\n" + err;
      }
    }

    document.getElementById("download-csv").addEventListener("click", () => {
      const csv = pyodide.runPython("results_csv()");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "deployment_schedule.csv";
      a.click();
      URL.revokeObjectURL(url);
    });

    main();
  </script>
</body>
</html>
