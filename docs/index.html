<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CIIM-SAI</title>
  <style>
  #loading {
    position: fixed;
    inset: 0;                      /* fill the viewport */
    background: rgba(250, 250, 248, 0.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    font-family: system-ui, sans-serif;
    z-index: 10;
  }
  #loading[hidden] { display: none; }

  .spinner {
    width: 2.5rem;
    height: 2.5rem;
    border: 3px solid #d5d5d0;
    border-top-color: #4a7aa7;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loading-status { margin: 0; color: #333; }
  #loading-quip {
    margin: 0;
    color: #999;
    font-style: italic;
    min-height: 1.3em;             /* no layout jump between quips */
    transition: opacity 0.3s;
  }
  </style>
</head>
<body>
  <div id="loading" hidden>
    <div class="spinner"></div>
    <p id="loading-status">Loading…</p>
    <p id="loading-quip"></p>
  </div>
  <h1>CIIM-SAI — proof of concept</h1>
  <pre id="output"></pre>

  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
  <script>
    const QUIPS = [
      "nucleating particles…",
      "balancing Earth's energy budget…",
      "reducing oxidants…",
      "arguing about terminology…",
    ];

    let quipTimer = null;

    function startQuips() {
      const el = document.getElementById("loading-quip");
      const order = [...QUIPS].sort(() => Math.random() - 0.5);  // shuffled copy
      let i = 0;
      const next = () => {
        el.style.opacity = 0;
        setTimeout(() => {
          el.textContent = order[i++ % order.length];
          el.style.opacity = 1;
        }, 300);                       // fade out, swap text, fade in
      };
      next();
      quipTimer = setInterval(next, 2600);
    }

    function showLoading(text) {
      document.getElementById("loading-status").textContent = text;
      const overlay = document.getElementById("loading");
      if (overlay.hidden) {
        overlay.hidden = false;
        startQuips();
      }
    }

    function hideLoading() {
      document.getElementById("loading").hidden = true;
      clearInterval(quipTimer);
      quipTimer = null;
    }

    async function main() {
      try {
        const pyodide = await loadPyodide();

        showLoading("Installing model package…");
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("./ciim_sai-0.1.0-py3-none-any.whl");

        showLoading("Running model…");
        const summary = pyodide.runPython(`
from CIIM_SAI.run import run

results = run()
(
    f"{len(results):,} rows — "
    f"{results['case'].nunique()} cases x {results['year'].nunique()} years\\n"
    f"total program cost, cheapest case:  ${'$'}{results.groupby('case')['total_cost'].sum().min()/1e9:,.2f}B\\n"
    f"total program cost, priciest case:  ${'$'}{results.groupby('case')['total_cost'].sum().max()/1e9:,.2f}B"
)
        `);

        showLoading("Done.");
        document.getElementById("output").textContent = summary;
      } catch (err) {
        hideLoading();
        document.getElementById("output").textContent = "FAILED:\n" + err;
      }
    }

    main();
  </script>
</body>
</html>
